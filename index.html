<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MegaGen Idle: an idle game about generating energy</title>
    <meta name="description" content="Build an energy empire, from one solar panel to a micro-supernova. It keeps generating while you're away. Play the free part in your browser." />
    <!-- site:json-ld -->
    <script type="module" src="/src/site/main.ts"></script>
  </head>
  <body>
    <!-- site:header -->
    <main class="site-main">
      <section class="hero" aria-labelledby="hero-title">
        <img class="pixel app-icon" src="/src/assets/brand/app_icon_1024.png" alt="" width="128" height="128" />
        <h1 id="hero-title">MegaGen Idle</h1>
        <p class="tagline" data-testid="tagline"><!-- site:tagline --></p>
        <div class="buttons" data-testid="hero-buttons">
          <!-- site:hero-buttons -->
        </div>
        <p class="launch" data-launch data-testid="launch"><!-- site:launch --></p>
        <ul class="stores" data-testid="stores"><!-- site:stores --></ul>
        <img class="pixel key-scene" src="/src/assets/brand/key_scene.png" alt="Solar panels, wind turbines, a dam and power plants on a hill at sunset" width="1920" height="1080" />
        <p class="pitch" data-testid="pitch"><!-- site:pitch --></p>
      </section>

      <!-- site:trailer -->

      <section class="section" aria-labelledby="features-title">
        <h2 id="features-title">What you do</h2>
        <ul class="cards" data-testid="features"><!-- site:features --></ul>
      </section>

      <section class="section" aria-labelledby="gallery-title">
        <h2 id="gallery-title">Screenshots</h2>
        <ul class="gallery" data-testid="gallery"><!-- site:gallery --></ul>
      </section>

      <section class="section fair" aria-labelledby="fair-title">
        <h2 id="fair-title">Fair by design</h2>
        <ul data-testid="fair"><!-- site:fair --></ul>
      </section>

      <section class="section" aria-labelledby="faq-title">
        <h2 id="faq-title">Questions</h2>
        <!-- site:faq -->
      </section>
    </main>
    <!-- site:footer -->
  </body>
</html>
