name: Deploy to GitHub Pages (temporary)

# Temporary (owner, after playtest 32): keeps https://joshridavis.github.io/megagen-idle/
# up to date until the site runs on Cloudflare Pages (docs/PUBLIC_RELEASE.md, 9c).
# Delete this file when Cloudflare is live, then unpublish GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.pages-check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      # Accounts and cloud saves (0.68): public project settings from the
      # repository's Actions variables. Empty until the owner adds them, and the
      # game then builds without accounts. Not secrets (docs/PUBLIC_RELEASE.md).
      - run: npm run build:web
        env:
          # the site lives under the repository name on github.io
          SITE_BASE: /megagen-idle/
          # the absolute address for link previews (2.09): megagenidle.com is not live yet
          SITE_URL: https://joshridavis.github.io/megagen-idle/
          # the owner playtests here: the full game, not the demo (2.04)
          PLAY_EDITION: full
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # "Continue with …" buttons to show, e.g. google,discord (1.22)
          VITE_AUTH_PROVIDERS: ${{ vars.VITE_AUTH_PROVIDERS }}
      # On a fresh repo Pages is still off, and configure-pages would fail.
      # Only a 404 means "not enabled": skip the deploy with a warning so the
      # run stays green. Any other API error falls through and fails loudly
      # in configure-pages.
      - name: Check whether GitHub Pages is enabled
        id: pages-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api "repos/${{ github.repository }}/pages" 2>&1); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -q "HTTP 404"; then
            echo "::warning title=GitHub Pages is not enabled::Deploy skipped. Set Settings > Pages > Source to 'GitHub Actions', then re-run this workflow (Actions > Deploy to GitHub Pages > Run workflow)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "Pages API check inconclusive, continuing: $out"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages-check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    if: needs.build.outputs.pages-enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
